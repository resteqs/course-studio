  <script>
    (function () {
      try {
        var saved = localStorage.getItem("course_studio_theme");
        if (saved === null) {
          saved = localStorage.getItem("schlossallee_theme");
          if (saved !== null) localStorage.setItem("course_studio_theme", saved);
        }
        if (saved === "dark" || (saved === null && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch (_) {
        if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
